name: MIM XHYN GTA5 A710

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl unzip zip build-essential flex bison \
            glslang-tools ninja-build pkg-config python3-pip
          sudo python3 -m pip install --quiet --break-system-packages \
            meson mako packaging pyyaml

      - name: Get A710 source
        run: |
          git clone --depth=1 https://github.com/Vauzi-17/710.git a710

      - name: Build MIM A710
        working-directory: a710
        env:
          BUILD_VERSION: "1.0"
          BUILD_TARGET: android
          BUILD_VARIANTS: base
          MESA_REF: main
          NDK_VERSION: android-ndk-r29
          ANDROID_NDK_HOME: ""
          DRIVER_NAME: "MIM XHYN GTA5 A710"
          DRIVER_DESCRIPTION: "MIM Turnip for Snapdragon 7s Gen 2 / Adreno 710"
          DRIVER_AUTHOR: "MIM Technology"
          ZIP_PREFIX: "MIM-XHYN-GTA5-A710"
        run: |
          bash ./turnip_builder.sh 2>&1 | tee build.log

      - name: Upload driver
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MIM-XHYN-GTA5-A710
          path: a710/out/*.zip
