name: MIM A710 EXTREME

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git curl unzip zip \
            build-essential flex bison \
            python3 python3-pip \
            ninja-build pkg-config \
            glslang-tools

          python3 -m pip install --user \
            meson mako packaging pyyaml

      - name: Clone A710 source
        run: |
          git clone --depth=1 \
            https://github.com/Vauzi-17/710.git \
            a710

      - name: Build MIM A710
        working-directory: a710
        env:
          BUILD_VERSION: "MIM-A710-EXTREME-1"
          BUILD_TARGET: android
          BUILD_VARIANTS: base
          MESA_REF: main
          DRIVER_NAME: "MIM XHYN GTA5 A710 EXTREME"
          DRIVER_DESCRIPTION: "MIM A710 Snapdragon 7s Gen 2"
          DRIVER_AUTHOR: "MIM Technology"
          ZIP_PREFIX: "MIM-XHYN-GTA5-A710-EXTREME"
        run: |
          chmod +x turnip_builder.sh
          bash turnip_builder.sh 2>&1 | tee build.log

      - name: Verify output
        run: |
          echo "=== BUILD OUTPUT ==="
          find a710/out -type f -maxdepth 2 -print
          echo "=== DRIVER CHECK ==="
          find a710/out -name "*.zip" -exec unzip -l {} \;

      - name: Upload MIM driver
        uses: actions/upload-artifact@v4
        with:
          name: MIM-XHYN-GTA5-A710-EXTREME
          path: a710/out/*.zip
